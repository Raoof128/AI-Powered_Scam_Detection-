version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: scamdetector-postgres-prod
    environment:
      POSTGRES_USER: ${DB_USER:-scamdetector}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
      POSTGRES_DB: ${DB_NAME:-scamdetector}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scamdetector"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scamdetector-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: scamdetector-redis-prod
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Redis password required}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - scamdetector-network
    restart: unless-stopped

  # FastAPI Application (Multiple instances for load balancing)
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Application
      APP_NAME: scam-detector
      ENVIRONMENT: production
      DEBUG: "false"

      # Database
      DATABASE_URL: postgresql://${DB_USER:-scamdetector}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-scamdetector}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # API
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_WORKERS: 4

      # Security
      SECRET_KEY: ${SECRET_KEY:?Secret key required}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://yourdomain.com}

      # ML Models
      MODEL_PATH: /app/data/models
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.75}

      # Monitoring
      ENABLE_PROMETHEUS: "true"
      PROMETHEUS_PORT: 9090
    volumes:
      - ./data/models:/app/data/models:ro
      - api_logs:/app/logs
    networks:
      - scamdetector-network
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: scamdetector-nginx
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    networks:
      - scamdetector-network
    restart: unless-stopped

  # Prometheus (Monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: scamdetector-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - scamdetector-network
    restart: unless-stopped

networks:
  scamdetector-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  api_logs:
  prometheus_data:
