# Grafana Dashboard Provisioning
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
#
# Auto-load dashboards from directory.

apiVersion: 1

providers:
  - name: 'Scam Detector'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
